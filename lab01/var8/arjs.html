<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>lab01 var8 — AR.js (Collider)</title>
    <script src="../../aframe/aframe.min.js"></script>
    <script src="../../AR.js-master/aframe/build/aframe-ar.js"></script>
    <style>html,body{overflow:hidden;margin:0;padding:0;height:100%;}</style>
  </head>
  <body>
    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
      <a-marker type="pattern" url="pattern-ATLAS-logo.patt">
        <a-torus radius="0.8" radius-tubular="0.15" position="0 0 0" material="opacity:0.2;transparent:true"></a-torus>
        <a-entity position="0 0 0">
          <a-entity rotation="0 0 0">
            <a-sphere position="0.7 0 0" radius="0.05" color="#ff0000">
              <a-animation attribute="rotation" dur="4000" to="0 360 0" repeat="indefinite" easing="linear"></a-animation>
            </a-sphere>
          </a-entity>
          <a-entity rotation="0 180 0">
            <a-sphere position="0.7 0 0" radius="0.05" color="#00ff00">
              <a-animation attribute="rotation" dur="4000" to="0 -360 0" repeat="indefinite" easing="linear"></a-animation>
            </a-sphere>
          </a-entity>
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
