<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lab01 Var8 — VR (Collider)</title>
    <script src="../../aframe/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Transparent torus representing the collider -->
      <a-torus position="0 1.5 -3" radius="1.2" radius-tubular="0.2" color="#888" material="opacity:0.2;transparent:true"></a-torus>

      <!-- Two protons moving inside the torus (simulate by rotating parent groups) -->
      <a-entity position="0 1.5 -3">
        <a-entity id="group1" rotation="0 0 0">
          <a-sphere position="1 0 0" radius="0.05" color="#ff0000"></a-sphere>
          <a-animation attribute="rotation" dur="4000" to="0 360 0" repeat="indefinite" easing="linear"></a-animation>
        </a-entity>
        <a-entity id="group2" rotation="0 180 0">
          <a-sphere position="1 0 0" radius="0.05" color="#00ff00"></a-sphere>
          <a-animation attribute="rotation" dur="4000" to="0 -360 0" repeat="indefinite" easing="linear"></a-animation>
        </a-entity>
      </a-entity>

      <a-entity light="type: point; intensity: 1.2; distance: 30" position="0 5 -2"></a-entity>
      <a-sky color="#111"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </body>
</html>
