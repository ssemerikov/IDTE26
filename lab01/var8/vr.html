<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab01 Var8 — VR (Collider)</title>
    <script src="../../aframe/aframe.min.js"></script>
  </head>
  <body>
    <a-scene renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true">
      <a-torus position="0 1.5 -3" rotation="90 0 0" radius="1.2" radius-tubular="0.05" color="#555" material="opacity:0.4;transparent:true;emissive:#333"></a-torus>

      <a-entity position="0 1.5 -3">
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
          <a-sphere position="1.2 0 0" radius="0.08" color="#ff0000" material="emissive:#ff0000;emissiveIntensity:0.8"></a-sphere>
        </a-entity>
        <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 4000; easing: linear">
          <a-sphere position="1.2 0 0" radius="0.08" color="#00ff00" material="emissive:#00ff00;emissiveIntensity:0.8"></a-sphere>
        </a-entity>
      </a-entity>

      <a-entity light="type: ambient; intensity: 0.5"></a-entity>
      <a-entity light="type: point; intensity: 1.2; distance: 30" position="2 5 2"></a-entity>
      <a-sky color="#050510"></a-sky>
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </body>
</html>
