<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lab01 var8 — MindAR (Collider)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-entity mindar-image-target="targetIndex: 0">
        <a-torus radius="0.8" radius-tubular="0.03" rotation="90 0 0" material="opacity:0.5;transparent:true;color:#888;emissive:#444"></a-torus>
        <a-entity position="0 0 0">
          <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
            <a-sphere position="0.8 0 0" radius="0.06" color="#ff0000" material="emissive:#ff0000;emissiveIntensity:0.8"></a-sphere>
          </a-entity>
          <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 4000; easing: linear">
            <a-sphere position="0.8 0 0" radius="0.06" color="#00ff00" material="emissive:#00ff00;emissiveIntensity:0.8"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
  </body>
</html>
