<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lab01 var5 — MindAR (Lithium atom)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity position="0 0 0" rotation="90 0 0">
          <a-sphere radius="0.1" color="#ffcc00" material="emissive:#ffcc00;emissiveIntensity:0.3"></a-sphere>

          <a-torus radius="0.3" radius-tubular="0.003" rotation="0 0 0" material="color:#00aaff;opacity:0.3;transparent:true;emissive:#00aaff;emissiveIntensity:0.2"></a-torus>
          <a-entity rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
            <a-sphere position="0.3 0 0" radius="0.03" color="#00aaff" material="emissive:#00aaff;emissiveIntensity:0.5"></a-sphere>
          </a-entity>

          <a-torus radius="0.45" radius-tubular="0.003" rotation="30 0 0" material="color:#00ffaa;opacity:0.3;transparent:true;emissive:#00ffaa;emissiveIntensity:0.2"></a-torus>
          <a-entity rotation="30 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear">
            <a-sphere position="0.45 0 0" radius="0.03" color="#00ffaa" material="emissive:#00ffaa;emissiveIntensity:0.5"></a-sphere>
          </a-entity>

          <a-torus radius="0.6" radius-tubular="0.003" rotation="60 0 0" material="color:#ff00aa;opacity:0.3;transparent:true;emissive:#ff00aa;emissiveIntensity:0.2"></a-torus>
          <a-entity rotation="60 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            <a-sphere position="0.6 0 0" radius="0.03" color="#ff00aa" material="emissive:#ff00aa;emissiveIntensity:0.5"></a-sphere>
          </a-entity>
        </a-entity>
      </a-entity>

      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
  </body>
</html>
