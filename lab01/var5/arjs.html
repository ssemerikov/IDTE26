<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>lab01 var5 — AR.js (Lithium atom)</title>
    <script src="../../aframe/aframe.min.js"></script>
    <script src="../../AR.js-master/aframe/build/aframe-ar.js"></script>
    <style>html,body{overflow:hidden;margin:0;padding:0;height:100%;}</style>
  </head>
  <body>
    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
      <a-marker type="pattern" url="pattern-Ernest_Rutherford_Arms.svg.patt">
        <a-entity id="atom" position="0 0 0">
          <a-sphere radius="0.06" color="#ffcc00" segments-height="18"></a-sphere>
          <a-entity rotation="0 0 0">
            <a-sphere position="0.25 0 0" radius="0.008" color="#00aaff"></a-sphere>
            <a-animation attribute="rotation" dur="4000" to="0 360 0" repeat="indefinite" easing="linear"></a-animation>
          </a-entity>
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
