<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тиждень 13 — Emotion/Age/Gender Detection</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.151.3/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.151.3/examples/jsm/",
            "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
        }
    }
    </script>
    <script src="../human-main/dist/human.js"></script>
    <style>
        html, body {
            position: relative;
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            line-height: 1.6;
            pointer-events: none;
        }
        #info-panel span {
            display: block;
        }
        #emotion-label {
            visibility: hidden;
            background: rgba(0, 0, 0, 0.75);
            color: #4CAF50;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="info-panel">
        <span id="age">Вік: ---</span>
        <span id="gender">Стать: ---</span>
    </div>
    <div id="emotion-label"></div>
    <script src="./main.js" type="module"></script>
</body>
</html>
